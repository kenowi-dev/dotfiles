[".local/share/zsh-snap"]
type  = "git-repo"
url   = "https://github.com/marlonrichert/zsh-snap.git"
exact = true
refreshPeriod = "168h" # once a week
pull  = { args = ["--quiet"] } # suppress git's "Already up to date." output

